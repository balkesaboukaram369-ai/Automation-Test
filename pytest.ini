[pytest]
testpaths = tests
pythonpath = .

# Standardoptionen bei jedem Testlauf:
#   --html ...              HTML-Bericht erzeugen (eine einzige Datei inkl. Screenshots)
#   -ra                     am Ende eine Zusammenfassung aller nicht bestandenen / xfail Tests
#   --css ...               eigenes Aussehen für den Bericht (Kacheln, farbige Priorität)
#   --tb=short              kurze Fehlerausgabe (der graue Text im Bericht und im Terminal)
#   --tracing ...           Playwright-Trace nur bei Fehlschlag aufbewahren (zur Fehleranalyse)
addopts =
    --html=reports/report.html
    --self-contained-html
    --css=config/report.css
    --tb=short
    -ra
    --tracing=retain-on-failure
    --output=reports/traces

# Ohne explizite Angabe von --browser laufen die Tests in Chromium, Firefox und WebKit
# (siehe pytest_configure in conftest.py).

# Im Bericht sind bestandene Tests und bekannte Fehler zugeklappt, neue Fehler sind sofort offen
render_collapsed = passed,xfailed

# Warnung stammt aus dem Plugin pytest-playwright (nicht aus unserem Code)
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning

markers =
    prio_hoch: Priorität Hoch laut Testplan (Geld, Daten, Sicherheit, Kernfunktion)
    prio_mittel: Priorität Mittel laut Testplan (Funktion beeinträchtigt)
    prio_niedrig: Priorität Niedrig laut Testplan (Darstellung, Komfort)
    smoke: wichtigste Kernfunktionen (schneller Überblick)
    mobile: Tests auf emulierten Mobilgeräten (iPhone, Android, iPad)
    external: Tests, die externe Webseiten öffnen (Internetverbindung nötig)
    known_bug: Tests, die bekannte Fehler der Demo-Benutzer dokumentieren
    accessibility: grundlegende Prüfungen der Barrierefreiheit
